/* Layout: full-bleed 3D brick archipelago; the HUD floats on top in brick-edged panels (right column on desktop, bottom sheet on phones). */
:root {
  --sky: #CFE6F2;
  --sea: #2D7DB5;
  --paper: #FFFFFF;
  --ink: #16233A;
  --muted: #56667B;
  --line: #D3DCE7;
  --chip: #EEF3F8;
  --brick: #D62839;
  --brick-shadow: #8E1724;
  --gold: #F2B705;
  --display: "Bricolage Grotesque", "Noto Sans TC", system-ui, sans-serif;
  --body: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #0D1B2A; --sea: #164A70; --paper: #122033; --ink: #E6EDF5; --muted: #9AAABD;
    --line: #2A3D55; --chip: #1A2D44; --brick: #FF5468; --brick-shadow: #A3283A; --gold: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #0D1B2A; --sea: #164A70; --paper: #122033; --ink: #E6EDF5; --muted: #9AAABD;
  --line: #2A3D55; --chip: #1A2D44; --brick: #FF5468; --brick-shadow: #A3283A; --gold: #FFC93C;
  color-scheme: dark;
}

html, body { height: 100%; margin: 0; }
body { background: var(--sky); color: var(--ink); font-family: var(--body); font-size: 14px; overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

.hud {
  position: fixed; inset: 0;
  padding-block: calc(env(safe-area-inset-top, 0px) + 12px) calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 12px;
  grid-template-columns: minmax(0, 1fr) 360px;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "top panel" ". panel" "time panel";
  pointer-events: none;
}
.hud > * { pointer-events: auto; }

.box {
  background: var(--paper); border: 2px solid var(--line); border-radius: 12px;
  box-shadow: 0 4px 0 var(--line);
}

.topbar { grid-area: top; justify-self: start; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 10px 14px; max-width: 100%; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: -0.01em; line-height: 1.1; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.actions { display: flex; gap: 8px; }

button { font: inherit; color: inherit; cursor: pointer; }
.btn {
  border: 0; border-radius: 8px; padding: 7px 14px; font-weight: 700; font-size: 13px;
  background: var(--chip); color: var(--ink); box-shadow: 0 3px 0 var(--line);
  transition: transform .08s ease, box-shadow .08s ease;
}
.btn.primary { background: var(--brick); color: #fff; box-shadow: 0 3px 0 var(--brick-shadow); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.btn.primary:active { box-shadow: 0 1px 0 var(--brick-shadow); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.panel { grid-area: panel; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.panel-scroll { overflow-y: auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.nat { display: flex; flex-wrap: wrap; gap: 6px; }
.nat-title { width: 100%; margin: 0; font-size: 11.5px; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.chip {
  border: 2px solid var(--line); background: var(--chip); border-radius: 999px; padding: 3px 10px;
  font-size: 12.5px; display: inline-flex; gap: 6px; align-items: baseline;
}
.chip b { font-family: var(--mono); font-weight: 500; font-size: 11.5px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #1d1600; }
.chip[aria-pressed="true"] b { color: #3d3000; }
.nat-summary { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--muted); }
.nat-summary strong { color: var(--ink); }

h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.1; letter-spacing: -0.01em; text-wrap: balance; }
.lede { margin: 6px 0 0; line-height: 1.65; color: var(--muted); max-width: 60ch; }

/* A 2x1 brick swatch: the group's color with two studs */
.brick {
  --c: #999; flex: none; width: 30px; height: 18px; border-radius: 4px; background:
    radial-gradient(circle at 25% 50%, rgba(255,255,255,.38) 0 3.5px, transparent 4.5px),
    radial-gradient(circle at 75% 50%, rgba(255,255,255,.38) 0 3.5px, transparent 4.5px), var(--c);
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.18);
}
.brick.lg { width: 44px; height: 26px; }

.glist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.glist button {
  width: 100%; display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 10px;
  text-align: left; background: transparent; border: 2px solid transparent; border-radius: 10px; padding: 7px 8px;
}
.glist button:hover { background: var(--chip); }
.glist button[disabled] { opacity: .45; cursor: default; }
.gname { font-weight: 700; font-size: 15px; }
.gmeta { display: block; color: var(--muted); font-size: 12px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tag { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.tag.live { color: #0d6b3e; background: #D7F3E3; }
.tag.new { color: #7a4b00; background: #FFEFC2; }
:root[data-theme="dark"] .tag.live { color: #8FE3B5; background: #173A2A; }
:root[data-theme="dark"] .tag.new { color: #FFD580; background: #3D2E0D; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .tag.live { color: #8FE3B5; background: #173A2A; }
  :root:not([data-theme="light"]) .tag.new { color: #FFD580; background: #3D2E0D; }
}

.back { align-self: flex-start; border: 0; background: none; padding: 0; color: var(--muted); font-size: 13px; font-weight: 700; }
.back:hover { color: var(--ink); }
.ghead { display: flex; align-items: center; gap: 12px; }
.ghead .label { margin: 3px 0 0; font-size: 11.5px; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; margin: 0; }
.facts div { background: var(--chip); border-radius: 8px; padding: 7px 10px; }
.facts dt { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.facts dd { margin: 2px 0 0; font-weight: 700; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; }
.facts dd.txt { font-family: var(--body); }
.para { margin: 0; line-height: 1.65; }
.para.small { font-size: 12.5px; color: var(--muted); }

.mtable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.mtable th { text-align: left; font-size: 11px; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 0 6px 6px; border-bottom: 2px solid var(--line); }
.mtable td { padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.mtable td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.mtable tbody tr { cursor: pointer; }
.mtable tbody tr:hover td { background: var(--chip); }
.mtable tr.sel td { background: color-mix(in srgb, var(--gold) 28%, transparent); }
.mtable tr.nat td:first-child { box-shadow: inset 3px 0 0 var(--gold); }
.mname { font-weight: 700; }
.mzh { color: var(--muted); font-weight: 400; margin-left: 4px; }
.mnote { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.5; }

.src { border-top: 2px solid var(--line); padding: 10px 16px 12px; font-size: 11.5px; line-height: 1.6; color: var(--muted); }
.src a { color: inherit; }

.timeline { grid-area: time; display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 6px 12px; padding: 10px 14px; }
.timeline label { font-size: 11.5px; letter-spacing: .08em; font-weight: 700; color: var(--muted); }
.timeline output { font-family: var(--display); font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
.timeline input { width: 100%; accent-color: var(--brick); }
.timeline .event { grid-column: 1 / -1; margin: 0; font-size: 12.5px; color: var(--muted); min-height: 1.5em; }
.timeline .event strong { color: var(--ink); }

.hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: 0; margin: 0; }

@media (max-width: 760px) {
  .hud {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto 42%;
    grid-template-areas: "top" "." "time" "panel";
    gap: 8px;
  }
  .brand h1 { font-size: 20px; }
  .topbar { padding: 8px 12px; gap: 8px 14px; }
  .timeline { padding: 8px 12px; }
  .timeline .event { min-height: 0; }
  h2 { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>

function renderNatChips() {
  const counts = {};

  const list = GROUPS.map((g) => {
    const ms = g.members.filter((m) => m.nat === state.nat);
    return ms.length ? `<strong>${esc(g.name)}</strong> ${ms.map((m) => esc(m.name)).join('、')}` : '';

  if (g.endYear) return `<span class="tag">已解散</span>`;

      </tbody>
    </table>
    ${former ? `<p class="para small">前成員：${former}</p>` : ''}`;
}

function renderPanel() {
  renderNatChips();

}

$('#panel').addEventListener('click', (e) => {
  const t = e.target.closest('[data-g],[data-m],[data-home],[data-nat]');
  if (!t) return;
  stopTour();
  if (t.dataset.g) selectGroup(t.dataset.g);
  else if (t.dataset.m) selectMember(t.dataset.m);
  else if ('home' in t.dataset) goHome();
  else if (t.dataset.nat) { state.nat = state.nat === t.dataset.nat ? null : t.dataset.nat; renderPanel(); refreshMarks(); }
});

  const tr = e.target.closest('tr[data-m]');

/* ---------- Timeline ---------- */
function yearEventText(y) {
  const parts = [];
  GROUPS.forEach((g) => { if (g.debutYear === y) parts.push(`<strong>${esc(g.name)}</strong> 出道`); });
  GROUPS.forEach((g) => { if (g.endYear === y) parts.push(`<strong>${esc(g.name)}</strong> 解散`); });
  DATA.events.forEach((ev) => { if (ev.year === y) parts.push(esc(ev.text)); });
  const live = GROUPS.filter((g) => g.debutYear <= y && !(g.endYear && y >= g.endYear)).length;
  return (parts.length ? parts.join('；') + '。' : '') + `這一年有 ${live} 個女團在活動。`;
}
function setYear(y) {
  state.year = y;
  $('#year').value = y;
  $('#yearOut').textContent = y;
  $('#yearEvent').innerHTML = yearEventText(y);

  if (state.groupId && groupById.get(state.groupId).debutYear > y && !state.touring) goHome();
  else if (!state.groupId) renderHome();
}

/* ---------- Idol illustrations ----------

const CX = 256;
const SKIN_SH = '#F3C7B8';
const SKIN_LINE = '#D99A88';
const EYE_SHAPES = { round: [58, 66, 0], almond: [62, 54, 0.08], cat: [64, 48, 0.22], droopy: [60, 58, -0.12] };
const LOCK_Y = { long: 540, mid: 490, bob: 450, short: 380, pony: 470, twin: 470, bun: 440 };
const BACK = { long: [735, 160], mid: [575, 165], bob: [470, 178], short: [420, 165], pony: [420, 165], twin: [420, 165], bun: [420, 165] };

function blob(x, fill, stroke, lw = 4) {
  x.fillStyle = fill; x.fill();
  if (stroke) { x.strokeStyle = stroke; x.lineWidth = lw; x.stroke(); }
}
function mirror(x, s, fn) { x.save(); if (s < 0) { x.translate(CX * 2, 0); x.scale(-1, 1); } fn(); x.restore(); }

function drawBackHair(x, o, hairFill, line) {
  const [yb, wb] = BACK[o.style] || BACK.long;
  x.beginPath();
  x.moveTo(CX - 170, 250);
  x.bezierCurveTo(CX - 196, 330, CX - wb - 12, yb - 130, CX - wb, yb);
  const n = 4;
  for (let k = 0; k < n; k++) {
    const x0 = -wb + (2 * wb * k) / n, x1 = -wb + (2 * wb * (k + 1)) / n;
    x.quadraticCurveTo(CX + (x0 + x1) / 2, yb - 30, CX + x1, yb + (k % 2 ? 0 : 8));
  }
  x.bezierCurveTo(CX + wb + 12, yb - 130, CX + 196, 330, CX + 170, 250);
  x.bezierCurveTo(CX + 178, 80, CX - 178, 80, CX - 170, 250);
  x.closePath();
  blob(x, hairFill, line);
  const tie = (tx, ty) => { x.beginPath(); x.arc(tx, ty, 16, 0, Math.PI * 2); blob(x, o.main, shade(o.main, -0.2), 3); };
  if (o.style === 'pony') {
    x.beginPath(); x.moveTo(CX + 110, 175);
    x.bezierCurveTo(CX + 270, 190, CX + 265, 430, CX + 205, 640);
    x.quadraticCurveTo(CX + 192, 600, CX + 168, 652);
    x.bezierCurveTo(CX + 205, 440, CX + 195, 270, CX + 96, 232);
    x.closePath(); blob(x, hairFill, line); tie(CX + 132, 190);
  }
  if (o.style === 'twin') {
    [-1, 1].forEach((s) => mirror(x, s, () => {
      x.beginPath(); x.moveTo(CX + 140, 190);
      x.bezierCurveTo(CX + 270, 220, CX + 262, 470, CX + 220, 660);
      x.quadraticCurveTo(CX + 200, 618, CX + 176, 668);
      x.bezierCurveTo(CX + 205, 460, CX + 195, 290, CX + 122, 245);
      x.closePath(); blob(x, hairFill, line); tie(CX + 152, 212);
    }));
  }
  if (o.style === 'bun') {
    x.beginPath(); x.arc(CX, 92, 64, 0, Math.PI * 2); blob(x, hairFill, line);
    x.strokeStyle = 'rgba(255,255,255,.3)'; x.lineWidth = 7; x.beginPath(); x.arc(CX, 92, 40, Math.PI * 1.15, Math.PI * 1.6); x.stroke();
    tie(CX, 150);
  }
}

function drawBody(x, o) {
  const dark = shade(o.main, -0.16), light = shade(o.main, 0.22);
  const line = shade(o.main, -0.3);
  const pants = o.variant === 2;
  // legs
  [-1, 1].forEach((s) => {
    x.beginPath(); x.roundRect(CX + s * 31 - 18, 700, 36, 172, 17);
    blob(x, pants ? '#2B2F45' : SKIN, pants ? '#1A1D2C' : SKIN_LINE, 3);
    if (!pants) { x.beginPath(); x.roundRect(CX + s * 31 - 19, 806, 38, 66, 12); blob(x, '#FFFFFF', '#C9C9D6', 3); }
    x.beginPath(); x.ellipse(CX + s * 36, 884, 31, 21, 0, 0, Math.PI * 2); blob(x, o.shoe, shade(o.shoe, -0.25), 3);
    x.fillStyle = 'rgba(255,255,255,.55)'; x.beginPath(); x.ellipse(CX + s * 30, 876, 10, 5, 0, 0, Math.PI * 2); x.fill();
  });
  // neck
  x.beginPath(); x.roundRect(CX - 22, 420, 44, 60, 10); blob(x, SKIN, SKIN_LINE, 3);
  x.fillStyle = SKIN_SH; x.beginPath(); x.ellipse(CX, 438, 26, 12, 0, 0, Math.PI); x.fill();
  // skirt or shorts

function idolCanvas(o) {
  const W = 512, H = 1024, K = 0.75;

  x.scale(K, K); x.translate(0, 62); x.lineJoin = 'round'; x.lineCap = 'round';
  const hg = x.createLinearGradient(0, 70, 0, 740);
  hg.addColorStop(0, shade(o.hair, 0.12)); hg.addColorStop(0.5, o.hair); hg.addColorStop(1, shade(o.hair, -0.05));
  const line = shade(o.hair, o.lightHair ? -0.28 : -0.12);
  drawBackHair(x, o, hg, line);
  drawBody(x, o);
  if (o.fan) drawFan(x);
  drawFace(x, o);
  drawFrontHair(x, o, hg, line);
  // acrylic cut: white border around the silhouette plus a tab under the feet
  const out = document.createElement('canvas'); out.width = art.width; out.height = art.height;
  const c = out.getContext('2d');
  const sil = document.createElement('canvas'); sil.width = art.width; sil.height = art.height;
  const sx = sil.getContext('2d');
  sx.drawImage(art, 0, 0); sx.globalCompositeOperation = 'source-in'; sx.fillStyle = '#FFFFFF'; sx.fillRect(0, 0, sil.width, sil.height);
  c.fillStyle = '#FFFFFF'; c.beginPath(); c.roundRect(CX * K - 60, 950 * K, 120, (H - 950) * K, 10); c.fill();
  for (let i = 0; i < 16; i++) { const a = (i / 16) * Math.PI * 2; c.drawImage(sil, Math.cos(a) * 7, Math.sin(a) * 7); }
  c.drawImage(art, 0, 0);
  return out;
}

function buildIsland(g) {
  const R = 5;
  const a = THREE.MathUtils.degToRad(g.angle);
  g.pos = new THREE.Vector3(Math.sin(a) * g.radius, 0, -Math.cos(a) * g.radius);
  g.baseColor = new THREE.Color(g.color);
  g.plateMat = new THREE.MeshStandardMaterial({ color: g.color, roughness: 0.38 });
  g.grey = 0; g.targetGrey = 0; g.targetY = 0;

  const root = new THREE.Group();
  root.position.copy(g.pos);
  root.userData.groupId = g.id;
  root.add(baseTile(R, g.color, g.plateMat));

  const dark = shade(g.color, -0.28);
  const stage = new THREE.Mesh(new THREE.BoxGeometry(5.4, 0.4, 1.7), mat(dark));
  stage.position.set(0, 0.7, -2.5); stage.castShadow = stage.receiveShadow = true; root.add(stage);

  back.material = [mat(dark), mat(dark), mat(dark), mat(dark), front, mat(dark)];
  back.position.set(0, 2.3, -3.45); back.castShadow = true; root.add(back);
  [-1, 1].forEach((s) => {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 3.4, 12), mat('#2B2D42'));
    post.position.set(s * 2.95, 2.2, -3.3); post.castShadow = true; root.add(post);
    const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.2, 14, 10), mat('#FFF3C4', { emissive: '#FFE08A', emissiveIntensity: 0.8 }));
    lamp.position.set(s * 2.95, 3.95, -3.3); root.add(lamp);
  });

  const n = g.members.length;
  const backN = n > 5 ? Math.ceil(n / 2) : n;
  g.members.forEach((m, i) => {
    const onStage = i < backN;
    const rowIdx = onStage ? i : i - backN;
    const rowN = onStage ? backN : n - backN;
    const light = new THREE.Color(m.hair).getHSL({}).l > 0.5;
    const look = {
      hair: m.hair, lightHair: light, style: m.style, bangs: m.bangs || ['curtain', 'full', 'side'][i % 3],
      eyes: m.eyes || ['round', 'almond', 'droopy'][i % 3], mouth: m.mouth || ['smile', 'open'][i % 2], extra: m.extra,
      iris: m.iris || '#8A5A3C', main: shade(g.color, (i % 3 - 1) * 0.04), acc: g.accent || shade(g.color, 0.18),
      variant: m.outfit ?? i % 3, accessory: i % 3, shoe: i % 2 ? '#FFFFFF' : '#2B2F45',
    };
    const fig = buildStandee(look, m.name, shade(g.color, -0.2));
    fig.position.set((rowIdx - (rowN - 1) / 2) * 1.05, onStage ? 0.9 : 0.5, onStage ? -2.4 : 0.3);
    fig.userData.wx = g.pos.x + fig.position.x; fig.userData.wz = g.pos.z + fig.position.z;
    fig.userData.baseY = fig.position.y;
    fig.userData.member = m;
    fig.userData.memberKey = m.key;
    fig.userData.phase = Math.random() * Math.PI * 2;
    fig.userData.jump = 1;
    const label = makeLabel(m.name); label.position.y = 2.6; label.visible = false; fig.add(label);
    const ring = new THREE.Mesh(G.ring, new THREE.MeshBasicMaterial({ color: '#F2B705' }));
    ring.position.y = 0.05; ring.visible = false; fig.add(ring);
    fig.userData.label = label; fig.userData.ring = ring;
    m.fig = fig;
    figs.push(fig);
    root.add(fig);
  });

  scene.add(root);
  pickables.push(root);
  g.root = root;
  buildBridge(g);
}

const plankMat = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.6 });
function buildBridge(g) {
  const dir = g.pos.clone().normalize();
  const start = 6.2, end = g.pos.length() - 5.7, len = end - start;
  const n = Math.floor(len / 0.8);
  const offset = (len - n * 0.8) / 2;
  const q = new THREE.Quaternion().setFromAxisAngle(UP, Math.atan2(dir.x, dir.z));
  const im = new THREE.InstancedMesh(G.plank, plankMat, n);
  const m = new THREE.Matrix4(), one = new THREE.Vector3(1, 1, 1);
  const c1 = new THREE.Color(g.subsidiary ? '#B9C7D6' : '#9C6B3F'), c2 = new THREE.Color(g.subsidiary ? '#A3B3C4' : '#87592F');
  for (let i = 0; i < n; i++) {
    const p = dir.clone().multiplyScalar(start + offset + 0.4 + i * 0.8); p.y = 0.15;
    m.compose(p, q, one); im.setMatrixAt(i, m); im.setColorAt(i, i % 2 ? c1 : c2);
  }
  im.castShadow = true; im.receiveShadow = true;
  const bridge = new THREE.Group(); bridge.add(im);
  const side = new THREE.Vector3(dir.z, 0, -dir.x);
  [-1, 1].forEach((s) => {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, len), mat(g.subsidiary ? '#7E8FA3' : '#5E3B1E'));
    rail.position.copy(dir.clone().multiplyScalar(start + len / 2).addScaledVector(side, s * 0.85)); rail.position.y = 0.5;
    rail.quaternion.copy(q); rail.castShadow = true; bridge.add(rail);
  });
  scene.add(bridge);
  g.bridge = bridge;
  g.dir = dir;
}

function buildHQ() {
  const R = 5.5;
  const root = new THREE.Group();
  root.userData.hq = true;
  const plateMat = mat('#E6EBF1');
  root.add(baseTile(R, '#E6EBF1', plateMat));
  const windows = canvasTex(256, 256, (x, w, h) => {
    x.fillStyle = '#F3F5F8'; x.fillRect(0, 0, w, h);
    for (let r = 0; r < 5; r++) for (let c = 0; c < 4; c++) {
      x.fillStyle = '#6FAEE0'; x.fillRect(18 + c * 58, 16 + r * 46, 46, 32);
      x.fillStyle = 'rgba(255,255,255,.5)'; x.fillRect(22 + c * 58, 20 + r * 46, 14, 8);
    }
  });
  const wm = new THREE.MeshStandardMaterial({ map: windows, roughness: 0.3 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(3.6, 4.4, 2.8), [wm, wm, mat('#F3F5F8'), mat('#F3F5F8'), wm, wm]);
  body.position.set(0, 2.7, -0.6); body.castShadow = body.receiveShadow = true; root.add(body);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(3.9, 0.22, 3.1), mat('#2B2D42'));
  roof.position.set(0, 5.01, -0.6); roof.castShadow = true; root.add(roof);
  const door = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.3, 0.1), mat('#2B2D42'));
  door.position.set(0, 1.15, 0.82); root.add(door);
  const signT = canvasTex(512, 160, (x, w, h) => {
    x.fillStyle = '#16233A'; x.fillRect(0, 0, w, h);
    x.fillStyle = '#fff'; x.font = `800 104px ${DISPLAY}`; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('JYP', w / 2, h / 2 + 6);
  });
  const sm = new THREE.MeshStandardMaterial({ map: signT, roughness: 0.5 });
  const sign = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.94, 0.2), [mat('#16233A'), mat('#16233A'), mat('#16233A'), mat('#16233A'), sm, mat('#16233A')]);
  sign.position.set(0, 5.6, 0.7); sign.castShadow = true; root.add(sign);
  scene.add(root);
  pickables.push(root);
}

function buildWalker() {
  const fig = buildStandee({
    hair: '#4A2E1E', style: 'short', bangs: 'side', eyes: 'round', mouth: 'open', iris: '#8A5A3C',
    main: '#F4F4F8', acc: '#D62839', variant: 2, accessory: 2, shoe: '#FFFFFF', fan: true,
  }, '粉絲', '#D62839');
  fig.scale.setScalar(0.8);
  scene.add(fig);
  walker = { fig, queue: [], next: 0, island: null, speed: 2.4, baseY: 0.5 };
  fig.position.set(0, 0.5, 4.6);
}
function walkerPlan() {
  const visible = GROUPS.filter((g) => g.debutYear <= state.year);
  if (!visible.length) return;
  const idx = visible.findIndex((g) => GROUPS.indexOf(g) >= walker.next);
  const g = idx >= 0 ? visible[idx] : visible[0];
  walker.next = GROUPS.indexOf(g) + 1;
  walker.island = g;
  const d = g.dir, L = g.pos.length();
  const P = (r, y) => { const v = d.clone().multiplyScalar(r); v.y = y; return v; };
  const A = P(4.7, 0.5), B = P(6.3, 0.24), C = P(L - 5.8, 0.24), D = P(L - 3.4, 0.5);
  walker.queue.push(A, B, C, D, C, B, A);
}

function initScene() {
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stageEl.appendChild(renderer.domElement);

  scene.background = new THREE.Color(cssVar('--sky'));
  scene.fog = new THREE.Fog(cssVar('--sky'), 70, 160);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = 1.28;
  controls.minDistance = 4;
  controls.maxDistance = 120;
  controls.addEventListener('start', () => { fly = null; stopTour(); });

  scene.add(new THREE.HemisphereLight('#ffffff', '#6C8296', 1.3));
  const sun = new THREE.DirectionalLight('#FFF6E5', 2.2);
  sun.position.set(26, 48, 22);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -32, right: 32, top: 32, bottom: -32, near: 1, far: 140 });
  sun.shadow.bias = -0.0006;
  scene.add(sun);

  seaGeo = new THREE.PlaneGeometry(260, 260, 64, 64).rotateX(-Math.PI / 2);
  seaMat = new THREE.MeshStandardMaterial({ color: cssVar('--sea'), roughness: 0.28, metalness: 0.05 });
  const sea = new THREE.Mesh(seaGeo, seaMat);
  sea.position.y = -0.45; sea.receiveShadow = true;
  scene.add(sea);

  buildHQ();
  GROUPS.forEach(buildIsland);
  buildWalker();
}

/* ---------- Camera ---------- */
let fly = null;
const ease = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
function flyTo(target, pos, dur = 1.3) {
  if (!controls) return;
  fly = { t: 0, dur: reduceMotion ? 0.001 : dur, fromT: controls.target.clone(), fromP: camera.position.clone(), toT: target, toP: pos };
}
const narrow = () => innerWidth <= 760;
function overview() {
  const k = narrow() ? 1.55 : 1;
  flyTo(new THREE.Vector3(0, 0, 3), new THREE.Vector3(0, 40 * k, 46 * k));
}
function focusGroup(g) {
  const k = narrow() ? 1.3 : 1;
  const t = g.pos.clone().add(new THREE.Vector3(0, 1.2, -0.5));
  flyTo(t, t.clone().add(new THREE.Vector3(0, 8.5 * k, 13 * k)));
}
function focusMember(m) {
  const p = new THREE.Vector3();
  m.fig.getWorldPosition(p);
  p.y = Math.max(p.y, 0) + 1.2;
  const k = narrow() ? 1.3 : 1;
  flyTo(p, p.clone().add(new THREE.Vector3(0, 2.2 * k, 6 * k)));
}

/* ---------- Selection ---------- */
function setHash(id) { try { history.replaceState(null, '', id ? '#' + id : location.pathname + location.search); } catch (e) { /* sandboxed */ } }
function selectGroup(id) {
  const g = groupById.get(id);
  if (!g) return;
  if (g.debutYear > state.year) setYear(Math.max(state.year, g.debutYear));
  state.groupId = id; state.memberKey = null;
  renderPanel(); refreshMarks(); focusGroup(g); setHash(id);
}
function selectMember(key) {
  const m = memberByKey.get(key);
  if (!m) return;
  if (state.groupId !== m.group.id) { state.groupId = m.group.id; setHash(m.group.id); }
  state.memberKey = key;
  m.fig && (m.fig.userData.jump = 0);
  renderPanel(); refreshMarks();
  m.fig && focusMember(m);
  const row = document.querySelector(`tr[data-m="${CSS.escape(key)}"]`);
  row && row.scrollIntoView({ block: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
}
function goHome() {
  state.groupId = null; state.memberKey = null;
  renderPanel(); refreshMarks(); overview(); setHash(null);
}
function refreshMarks() {
  figs.forEach((fig) => {
    const m = fig.userData.member;
    const sel = state.memberKey === m.key;
    const nat = !!state.nat && m.nat === state.nat;
    fig.userData.label.visible = state.memberKey ? sel : (state.groupId === m.group.id || nat);
    fig.userData.ring.visible = sel || nat;
    fig.userData.ring.material.color.set(sel ? '#D62839' : '#F2B705');
  });
}

function applyYear() {
  GROUPS.forEach((g) => {
    if (!g.root) return;
    const vis = g.debutYear <= state.year;
    g.targetY = vis ? 0 : -4.5;
    g.bridge.visible = vis;
    g.targetGrey = g.endYear && state.year >= g.endYear ? 1 : 0;
  });
  if (walker && walker.island && walker.island.debutYear > state.year) {
    walker.queue = [walker.island.dir.clone().multiplyScalar(4.7).setY(0.5)];
  }
}

/* ---------- Tour ---------- */
let tourTimer = null;
function stopTour() {
  if (!state.touring) return;
  state.touring = false; clearTimeout(tourTimer);
  $('#btnTour').textContent = '▶ 出道導覽';
}
function startTour() {
  const steps = [...GROUPS].sort((a, b) => a.debut.localeCompare(b.debut));
  let i = 0;
  state.touring = true;
  $('#btnTour').textContent = '■ 停止導覽';
  const step = () => {
    if (!state.touring) return;
    if (i >= steps.length) { stopTour(); setYear(2026); goHome(); return; }
    const g = steps[i++];
    setYear(g.debutYear);
    selectGroup(g.id);
    tourTimer = setTimeout(step, 4600);
  };
  step();
}
$('#btnTour').addEventListener('click', () => (state.touring ? stopTour() : startTour()));
$('#btnHome').addEventListener('click', () => { stopTour(); goHome(); });
addEventListener('keydown', (e) => { if (e.key === 'Escape') { stopTour(); goHome(); } });

/* ---------- Picking ---------- */
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
function hitAt(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  for (const h of ray.intersectObjects(pickables, true)) {
    if (!h.object.visible) continue;
    for (let o = h.object; o; o = o.parent) {
      if (o.userData.memberKey) {
        if (memberByKey.get(o.userData.memberKey).group.debutYear > state.year) break;
        return { member: o.userData.memberKey };
      }
      if (o.userData.groupId) {
        if (groupById.get(o.userData.groupId).debutYear > state.year) break;
        return { group: o.userData.groupId };
      }
      if (o.userData.hq) return { hq: true };
    }
  }
  return null;
}

/* ---------- Theme ---------- */
function applySceneTheme() {
  if (!renderer) return;
  scene.background.set(cssVar('--sky'));
  scene.fog.color.set(cssVar('--sky'));
  seaMat.color.set(cssVar('--sea'));
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySceneTheme);
new MutationObserver(applySceneTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ---------- Boot ---------- */
renderPanel();
setYear(2026);

if (renderer) {
  initScene();
  applyYear();
  GROUPS.forEach((g) => { g.root.position.y = g.targetY; });

  const resize = () => {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    const pr = $('#panel').getBoundingClientRect();
    const sx = narrow() ? 0 : (pr.width + 16) / 2;
    const sy = narrow() ? Math.max(0, h - pr.top) / 2 : 0;
    camera.setViewOffset(w, h, sx, sy, w, h);
    camera.updateProjectionMatrix();
  };
  addEventListener('resize', resize);
  resize();

  const k = narrow() ? 1.55 : 1;
  camera.position.set(0, 40 * k, 46 * k);
  controls.target.set(0, 0, 3);

  const canvas = renderer.domElement;
  let down = null, hoverQueued = false, lastMove = null;
  canvas.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; });
  canvas.addEventListener('pointerup', (e) => {
    if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) { down = null; return; }
    down = null;
    const hit = hitAt(e);
    if (!hit) return;
    stopTour();
    if (hit.member) selectMember(hit.member);
    else if (hit.group) selectGroup(hit.group);
    else if (hit.hq) goHome();
  });
  canvas.addEventListener('pointermove', (e) => {
    lastMove = e;
    if (hoverQueued || e.pointerType !== 'mouse') return;
    hoverQueued = true;
    requestAnimationFrame(() => { hoverQueued = false; canvas.style.cursor = hitAt(lastMove) ? 'pointer' : 'grab'; });
  });

  const initial = location.hash.slice(1);
  if (groupById.has(initial)) selectGroup(initial);

  const clock = new THREE.Clock();
  let frame = 0;
  const seaPos = seaGeo.attributes.position;
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;
    frame++;

    if (fly) {
      fly.t += dt;
      const kk = ease(Math.min(1, fly.t / fly.dur));
      controls.target.lerpVectors(fly.fromT, fly.toT, kk);
      camera.position.lerpVectors(fly.fromP, fly.toP, kk);
      if (kk >= 1) fly = null;
    }
    controls.update();

    if (!reduceMotion && frame % 2 === 0) {
      for (let i = 0; i < seaPos.count; i++) {
        const x = seaPos.getX(i), z = seaPos.getZ(i);
        seaPos.setY(i, Math.sin(x * 0.18 + t * 0.9) * 0.07 + Math.cos(z * 0.14 + t * 0.7) * 0.07);
      }
      seaPos.needsUpdate = true;
      seaGeo.computeVertexNormals();
    }

    const lerpK = Math.min(1, dt * 4);
    GROUPS.forEach((g) => {
      g.root.position.y += (g.targetY - g.root.position.y) * lerpK;
      g.grey += (g.targetGrey - g.grey) * lerpK;
      g.plateMat.color.copy(g.baseColor).lerp(GREY, g.grey * 0.7);
    });

    const cam = camera.position;
    figs.forEach((fig) => {
      const u = fig.userData;
      const sel = state.memberKey === u.member.key;
      fig.rotation.y = Math.atan2(cam.x - u.wx, cam.z - u.wz) + (reduceMotion ? 0 : Math.sin(t * 0.8 + u.phase) * 0.06);
      if (u.jump < 1) u.jump = Math.min(1, u.jump + dt * 1.8);
      const hop = u.jump < 0.5 ? Math.sin(Math.PI * u.jump * 2) * 0.45 : 0;
      const bob = sel && !reduceMotion ? Math.abs(Math.sin(t * 4)) * 0.12 : 0;
      fig.position.y = u.baseY + hop + bob;
    });

    if (walker) {
      if (!walker.queue.length) walkerPlan();
      const target = walker.queue[0];
      const f = walker.fig;
      if (target) {
        const dx = target.x - f.position.x, dz = target.z - f.position.z;
        const dist = Math.hypot(dx, dz);
        const stepLen = walker.speed * dt;
        if (dist <= stepLen || dist < 0.01) { walker.baseY = target.y; f.position.x = target.x; f.position.z = target.z; walker.queue.shift(); }
        else {
          f.position.x += dx / dist * stepLen;
          f.position.z += dz / dist * stepLen;
          walker.baseY += (target.y - walker.baseY) * Math.min(1, stepLen / dist);
        }
      }
      f.position.y = walker.baseY + (reduceMotion ? 0 : Math.abs(Math.sin(t * 8)) * 0.12);
      f.rotation.y = Math.atan2(cam.x - f.position.x, cam.z - f.position.z);
    }

    renderer.render(scene, camera);
  });
}
</script>
</body>
</html>
